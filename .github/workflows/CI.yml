      # - name: Get EC2 Public IP from Terraform Output
      #   id: get_ec2_ip
      #   run: |
      #     EC2_IP=$(terraform output -raw ec2_public_ip_address)
      #     echo "ec2_ip_address=$EC2_IP" >> $GITHUB_OUTPUT
    


#Log in Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PATOKEN }}


#Build and push Docker image
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: karimrushdy/konvert_to_convert:latest


# Pull and run the Docker container on AWS EC2 instance
      - name: SSH and deploy container
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ steps.ec2_public_ip_address.output.tf.ec2_ip_address }}
          username: ubuntu
          key: ${{ secrets.EC2SSH }}
          script: |
            docker pull karimrushdy/konvert_to_convert:latest
            docker stop konvert_container || true
            docker rm konvert_container || true
            docker run -d --name konvert_container -p 80:3000 karimrushdy/konvert_to_convert:latest



