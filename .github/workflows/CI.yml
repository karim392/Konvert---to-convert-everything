name: Node JS web CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3

      - name: Set up node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run node.js tests
        run: |
         npm install jest && npx jest
         npm test
        

# CD

#setup terraform
      # - name: Set up Terraform
