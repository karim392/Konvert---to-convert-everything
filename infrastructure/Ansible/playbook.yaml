---

- name: Install Docker on Ubuntu
  hosts: all
  become: true
  tasks:


    - name: Install dependencies
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - apt-transport-https
        - ca-certificates
        - curl
        - gnupg
        - lsb-release


    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present


    - name: Add Docker APT repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu focal stable
        state: present


    - name: Install Docker Engine
      apt:
        name: docker-ce
        state: present
        update_cache: true


    - name: Pull Docker image from Docker Hub
      docker_image:
        name: karimrushdy/konvert_to_convert:latest
        source: pull
 

    - name: Run Docker container
      docker_container:
        name: konvert_to_convert_container
        image: karimrushdy/konvert_to_convert:latest
        state: started
        restart_policy: always
        ports:
          - "80:3000"
   
    

