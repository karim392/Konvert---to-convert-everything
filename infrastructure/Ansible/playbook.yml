---


- name: Install Docker
  hosts: all
  become: yes
  tasks:
    - name: Update apt package index
      apt:
        update_cache: yes
    - name: Install prerequisite packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present

    - name: Add Docker's official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
    - name: Add Docker APT repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present

    - name: Update apt package index after adding Docker repo
      apt:
        update_cache: yes

    - name: Install Docker CE
      apt:
        name: docker-ce
        state: present

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes



- name: Pull Docker Image
  hosts: all
  become: yes
  tasks:
    - name: Pull the latest Konvert app image
      docker_image:
        name: karimrushdy/konvert_to_convert
        tag: latest
        source: pull
- name: Run Docker Container
  hosts: all
  become: yes
  tasks:
    - name: Run Konvert app container
      docker_container:
        name: konvert_app
        image: karimrushdy/konvert_to_convert:latest
        state: started
        ports:
          - "3000:3000"
        restart_policy: always
        detach: yes
      